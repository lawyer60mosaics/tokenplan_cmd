name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.20.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --console --name xcli --add-data "zellij.kdl;." app.py
      - run: dist/xcli.exe --version
      - run: dist/xcli.exe --demo --once --json
      - name: Prepare standalone package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item -LiteralPath 'dist/xcli.exe','start.cmd','start-config.cmd','start-zellij.cmd','README.md','LICENSE','NOTICE.md' -Destination package
          cmd.exe /d /c "package\start.cmd --version"
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" installer/xcli.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed executable
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/XCLI-*-Setup-x64.exe).FullName
          $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          & "$env:LOCALAPPDATA/Programs/XCLI/xcli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA/Programs/XCLI/xcli.exe" --demo --once --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: tokenplan-cmd-windows-x64
          path: package/

      - uses: actions/upload-artifact@v4
        with:
          name: xcli-windows-installer
          path: dist/XCLI-*-Setup-x64.exe
      - name: Publish installer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/XCLI-*-Setup-x64.exe --verify-tag --title "XCLI $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
