name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.20.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --console --name tokenplan --add-data "zellij.kdl;." app.py
      - run: dist/tokenplan.exe --version
      - run: dist/tokenplan.exe --demo --once --json
      - uses: actions/upload-artifact@v4
        with:
          name: tokenplan-cmd-windows-x64
          path: |
            dist/tokenplan.exe
            start.cmd
            start-config.cmd
            start-zellij.cmd
            README.md
            LICENSE
            NOTICE.md
