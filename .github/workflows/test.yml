name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install ruff==0.14.0
      - run: python -m ruff check app.py quota tests
      - run: python app.py --version
      - run: python app.py --demo --once --json
      - run: python -m compileall -q app.py quota tests
